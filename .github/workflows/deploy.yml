name: Build and publish image

# Runs only when you push a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`)
# or click "Run workflow" in the Actions tab. Ordinary commits don't trigger it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Audit, build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stop before publishing if production dependencies have high/critical advisories.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build app
        run: pnpm build

      # The server preloads Sentry from instrument.server.mjs; .output doesn't
      # bundle @sentry/node, so the image installs the exact locked version.
      - name: Read @sentry/node version
        id: sentry
        run: echo "version=$(node -p "require('./node_modules/@sentry/node/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: illispi/seintrack
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_NODE_VERSION=${{ steps.sentry.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
